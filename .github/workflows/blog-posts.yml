# File: blog-posts.yml
# Description: Weekly workflow that refreshes the "Latest Blog Posts" section
#   of README.md as a 3-column table from the KytheX, The Alz Diary, and
#   Tierra de Oz blog RSS feeds. All 3 are fetched through a real headless
#   browser (see scripts/update-blog-readme.js), uniformly, because
#   Cloudflare's Bot Fight Mode can silently JS-challenge plain HTTP clients
#   from a GitHub-hosted runner's datacenter ASN even on feeds that pass fine
#   from a residential IP — a real browser resolves the challenge the same
#   way a normal visitor's would.
# Author: Jose-Jorge HERNANDEZ
# Company: Parlee Conseiller, Inc.
# Date: 2026-09-11
# Last edit date: 2026-09-14
# Version: 1.1.0

name: Update Blog Posts

permissions:
  contents: write

on:
  schedule:
    # Weekly, Wednesday 12:00 UTC (~06:00 CST Mexico City) — posts are
    # published Mon/Tue, so this picks them up a day or two later.
    - cron: "0 12 * * 3"

  workflow_dispatch:

concurrency:
  group: github-profile
  cancel-in-progress: false

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Fetch feed and update README
        run: node scripts/update-blog-readme.js

      - name: Commit changes
        run: |
          git config user.name "blog-post-bot"
          git config user.email "blog-post-bot@example.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "Updated with the latest blog posts" && git push)
