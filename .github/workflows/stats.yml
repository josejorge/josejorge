# File: stats.yml
# Description: Every 6 hours, regenerates the Top Languages card and the
#   Activity Graph heatmap as static SVGs and commits them into /assets, so
#   README.md embeds local files instead of live third-party badge URLs.
#   The activity graph previously embedded https://github-readme-activity-graph.vercel.app
#   directly, but that public deployment has been shut down (returns
#   402 DEPLOYMENT_DISABLED) — ghchart.rshah.org is used instead, a
#   long-stable, actively-maintained contribution heatmap SVG service.
# Author: Jose-Jorge HERNANDEZ
# Company: Parlee Conseiller, Inc.
# Date: 2026-09-14
# Last edit date: 2026-09-14
# Version: 1.0.0

name: Update GitHub Stats

permissions:
  contents: write

concurrency:
  group: github-profile
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2.0.0
        with:
          card: top-langs
          options: username=josejorge&layout=compact&langs_count=8
          path: assets/top-langs.svg
          token: ${{ secrets.JOSEJORGE_TOKEN }}

      - name: Fetch Activity Graph heatmap
        run: |
          curl -sL --fail --max-time 30 \
            "https://ghchart.rshah.org/0e75b6/josejorge" \
            -o assets/activity-graph.svg

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/top-langs.svg assets/activity-graph.svg

          git commit -m "Update GitHub stats" || echo "No changes to commit"

          git pull --rebase origin main

          git push
